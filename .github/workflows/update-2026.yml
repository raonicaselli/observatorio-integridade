name: Atualizar eleitos PL 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-2026.mjs
      - .github/workflows/update-2026.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Importar primeiro turno 2026
        run: npm run import:2026
      - name: Conferir e versionar a importação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/eleitos-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar eleitos PL 2026 do primeiro turno"
            git push
          fi
      - run: npm run validate:data
      - run: npm run validate:coverage
      - run: npm run validate:ocorrencias
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
