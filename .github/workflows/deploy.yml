name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes
        run: npm test
      - name: Validar decisões de identidade e preservar histórico
        run: |
          git rev-parse --verify HEAD^ >/dev/null
          baseline_path="$(git ls-tree --name-only HEAD^ -- docs/registro-decisoes-identidade.json)"
          if [ -n "$baseline_path" ]; then
            git show HEAD^:docs/registro-decisoes-identidade.json > "$RUNNER_TEMP/identidades-anteriores.json"
            npm run validate:identidades -- --anterior "$RUNNER_TEMP/identidades-anteriores.json"
          else
            npm run validate:identidades
          fi
      - name: Validar exemplo do contrato v2
        run: npm run validate:exemplo-v2
      - name: Verificar integridade dos dados
        run: npm run validate:data
      - name: Verificar aprovação de ocorrências
        run: npm run validate:ocorrencias
      - name: Verificar cobertura e preservar histórico
        run: |
          git rev-parse --verify HEAD^ >/dev/null
          baseline_path="$(git ls-tree --name-only HEAD^ -- public/data/cobertura-pesquisa.json)"
          if [ -n "$baseline_path" ]; then
            git show HEAD^:public/data/cobertura-pesquisa.json > "$RUNNER_TEMP/cobertura-anterior.json"
            npm run validate:coverage -- --anterior "$RUNNER_TEMP/cobertura-anterior.json"
          else
            npm run validate:coverage
          fi
      - run: npm run validate:2026
      - name: Compilar aplicação
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
