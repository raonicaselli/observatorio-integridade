name: Importar eleitos PL 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-2026.mjs
      - .github/workflows/update-2026.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do importador
        run: node --check scripts/import-2026.mjs
      - name: Importar resultados primeiro turno 2026
        run: npm run import:2026
      - name: Validar quantidade e integridade
        run: |
          node -e "const d=require('./public/data/eleitos-2026.json');if(d.pessoas.length<121||d.pessoas.filter(p=>p.cargo==='DEPUTADO FEDERAL').length!==121)process.exit(1); console.log(d.metadados)"
      - name: Publicar atualização na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/eleitos-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar eleitos PL 2026 do primeiro turno"
            git push
          fi
      - name: Guardar cópia de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eleitos-2026-diagnostico
          path: public/data/eleitos-2026.json
