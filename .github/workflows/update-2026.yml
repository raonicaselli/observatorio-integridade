name: Propor atualização dos resultados PL 2026
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: atualizar-resultados-2026
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preservar base anterior
        run: |
          cp public/data/eleitos-2026.json "$RUNNER_TEMP/eleitos-2026-anterior.json"
          cp public/data/cobertura-pesquisa.json "$RUNNER_TEMP/cobertura-anterior.json"
      - name: Instalar dependências
        run: npm ci
      - name: Testar importação e aplicação
        run: npm test
      - name: Importar os dois turnos oficiais
        run: npm run import:2026
      - name: Reconciliar cobertura sem apagar pesquisa
        run: npm run sync:coverage
      - name: Validar dados e aplicação
        run: |
          npm run validate:data
          npm run validate:ocorrencias
          npm run validate:coverage -- --anterior "$RUNNER_TEMP/cobertura-anterior.json"
          npm run validate:2026
          node scripts/reconcile-elections.mjs
          npm run build
      - name: Gerar comparação auditável
        run: |
          mkdir -p docs/auditorias
          node scripts/compare-elections-2026.mjs "$RUNNER_TEMP/eleitos-2026-anterior.json" public/data/eleitos-2026.json docs/auditorias/ultima-atualizacao-2026.json
      - name: Criar branch revisável e PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/eleitos-2026.json public/data/vinculos-eleitorais-pendentes.json public/data/cobertura-pesquisa.json; then
            echo 'Nenhuma alteração eleitoral; nenhum PR necessário.'
            exit 0
          fi
          branch="data/resultados-2026-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/eleitos-2026.json public/data/vinculos-eleitorais-pendentes.json public/data/cobertura-pesquisa.json docs/auditorias/ultima-atualizacao-2026.json
          git commit -m 'data: propor atualização dos resultados TSE 2026'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title 'data: atualizar resultados TSE 2026' --body-file docs/modelo-pr-atualizacao-eleitoral.md
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-2026-diagnostico
          path: |
            public/data/eleitos-2026.json
            public/data/vinculos-eleitorais-pendentes.json
            public/data/cobertura-pesquisa.json
            docs/auditorias/ultima-atualizacao-2026.json
